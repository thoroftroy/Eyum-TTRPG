<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyum TTRPG</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="title">Eyum TTRPG</div>
        <button id="toggleSidebar" class="ghost-button" title="Toggle sidebar">☰</button>
      </div>
      <div class="search-wrap" id="searchWrap">
        <div class="search-box" id="searchBox">
          <span class="search-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg></span>
          <input id="searchInput" class="search-input" type="text" placeholder="Search the handbook…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search the handbook" />
          <button id="searchClear" class="search-clear" title="Clear search" aria-label="Clear search" hidden>✕</button>
        </div>
        <div id="searchDropdown" class="search-dropdown" role="listbox" aria-label="Search results"></div>
      </div>
      <nav id="tree" class="tree" aria-label="Files"></nav>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="mobileSidebar" class="ghost-button" title="Open sidebar">☰</button>
          <div id="breadcrumbs" class="breadcrumbs"></div>
        </div>
        <div class="toolbar-right">
          <button id="prevFile" class="ghost-button" title="Previous file" disabled>◂</button>
          <button id="nextFile" class="ghost-button" title="Next file" disabled>▸</button>
          <div class="settings-wrap">
            <button id="settingsBtn" class="ghost-button" title="Settings">⚙ Settings</button>
            <div id="settingsPanel" class="settings-panel">
              <div class="settings-title">Colors</div>
              <label class="settings-row">
                <span>Text</span>
                <input type="color" id="textColor" value="#ffffff" />
              </label>
              <label class="settings-row">
                <span>Background</span>
                <input type="color" id="bgColor" value="#000000" />
              </label>
              <label class="settings-row">
                <span>Table Header</span>
                <input type="color" id="tableHeaderColor" value="#161616" />
              </label>
              <label class="settings-row">
                <span>Table Row A</span>
                <input type="color" id="tableRowAColor" value="#242424" />
              </label>
              <label class="settings-row">
                <span>Table Row B</span>
                <input type="color" id="tableRowBColor" value="#1d1d1d" />
              </label>
              <button id="resetTheme" class="ghost-button settings-reset">Reset Colors</button>
            </div>
          </div>
          <div class="settings-wrap">
            <button id="downloadsBtn" class="ghost-button" title="Downloads">⭳ Downloads</button>
            <div id="downloadsPanel" class="settings-panel">
              <div class="settings-title">Downloads</div>
              <button id="dlObsidian" class="ghost-button download-item">Handbook (.md for Obsidian)</button>
              <button id="dlText" class="ghost-button download-item">Handbook (Raw Text)</button>
              <a href="./character-sheet.pdf" download="Eyum Character Sheet v5.pdf" class="ghost-button download-item">Blank Character Sheet (PDF)</a>
            </div>
          </div>
        </div>
      </header>

      <article id="content" class="content">
        <div class="loading">Loading handbook...</div>
      </article>
    </main>
  </div>

  <button id="graphToggle" class="graph-toggle" title="Graph view" aria-label="Toggle graph view" style="display:none">⟐</button>
  <a href="./more-graphs.html" class="graph-toggle more-graphs-btn" title="More Graphs" style="bottom:0px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;">📊</a>
  <a href="./equipment-analyzer.html" class="graph-toggle more-graphs-btn" title="Equipment Analyzer" style="bottom:46px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;">⚔</a>

  <div id="graphPanel" class="graph-panel">
    <div class="graph-header">
      <div class="graph-header-left">
        <span>Graph View</span>
      </div>
      <button id="graphClose" class="ghost-button" title="Close graph">✕</button>
    </div>
    <div id="graphCanvas" class="graph-canvas">
      <div class="graph-zoom-controls">
        <button class="graph-zoom-btn" id="graphZoomIn" title="Zoom in">+</button>
        <button class="graph-zoom-btn" id="graphZoomOut" title="Zoom out">−</button>
        <button class="graph-zoom-btn" id="graphReset" title="Reset view">⌂</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
